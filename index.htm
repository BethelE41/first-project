<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/index.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="main">
      <div class="left">
        <div class="overlay">
          <div class="hold">
            <img src="image/odin-lined.png" alt="" class="log" />
            <h2 class="name">ODIN</h2>
          </div>
        </div>
      </div>
      <div class="right">
        <div class="phrase">
          <p class="first">
            This is not a real online service! You know you need something like
            this in your real life to help you realize your deepest dream.
          </p>
          <p class="second">Sign up now to get started.</p>
          <p class="third">You know you want to.</p>
        </div>

        <div class="fill">
          <p>Let's do this!</p>
          <div class="select">
            <div class="name_first">
              <label for="First Name">FIRST NAME</label>
              <br />
              <input type="text" />
            </div>
            <div>
              <label for="Last Name">LAST NAME</label>
              <br />
              <input type="text" />
            </div>
          </div>
          <div class="select1">
            <div class="email_first">
              <label for="email"> EMAIL</label>
              <br />
              <input type="email" />
            </div>
            <div>
              <label for="phone_number">PHONE NUMBER</label>
              <br />
              <input type="number" />
            </div>
          </div>
           <div class="select2">
            <div class="passwor_first">
              <label for="password"> PASSWORD</label>
              <br />
              <input type="password" class="pass" />
            </div>
            <div class="conf_password">
              <label for="password">CONFIRM PASSWORD</label>
              <br />
              <input type="password" class="conf" />
            </div>
        </div>
      </div>
      <div class="buttn">
        <button type="button" class="sumit">Create Account</button>
        <p>Already have an account ? <span class="acc">Log in</span></p>
      </div>
    </div>
  </body>
</html>
